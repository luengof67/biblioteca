<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca · sin conexión</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF8F3;color:#211F1B;font-family:"Segoe UI",system-ui,sans-serif;text-align:center}
  .hanko{width:70px;height:70px;margin:0 auto 22px;border-radius:14px;border:2.5px solid #B23A32;color:#B23A32;display:grid;place-items:center;font-size:30px;font-weight:700;background:#fff;transform:rotate(-3deg)}
  h1{font-size:24px;font-weight:600;margin:0 0 8px}
  p{color:#54504A;font-size:15px;margin:0 0 26px;max-width:340px}
  a{display:inline-block;padding:13px 26px;border-radius:11px;background:#2C3A5E;color:#fff;font-weight:700;text-decoration:none}
  a:hover{background:#232f4d}
</style>
</head>
<body>
  <div>
    <div class="hanko">蔵</div>
    <h1>Sin conexión</h1>
    <p>La Biblioteca necesita internet la primera vez que se abre. Después funciona aunque se caiga la red.</p>
    <a href="https://biblioteca-cocina.web.app/">Reintentar</a>
  </div>
</body>
</html>
